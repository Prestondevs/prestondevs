# draws the contribution grid as a snake and commits the result to the `output` branch,
# which is what the README points at. runs twice a day so the snake stays current
name: generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: draw the snake
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # two versions so the README can serve the right one per colour scheme.
          # the dots run from the page background up to the accent
          outputs: |
            dist/github-snake.svg?color_snake=#3d444d&color_dots=#ebedf0,#d0d7de,#afb8c1,#8c959f,#3d444d
            dist/github-snake-dark.svg?color_snake=#8b949e&color_dots=#17202a,#2d333b,#444c56,#636e7b,#8b949e

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
